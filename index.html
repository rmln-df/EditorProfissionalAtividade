<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050608">
<title>Esfera</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#050608;color:#fff;font-family:Arial,sans-serif}
.app{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 48%,#303846 0,transparent 27%),radial-gradient(circle at 50% 60%,#151b26,#030405 72%)}
.header{position:absolute;top:0;left:0;right:0;padding:28px 18px 12px;z-index:20;display:flex;justify-content:space-between;align-items:center}
.title{font-size:22px;font-weight:700;text-shadow:0 2px 12px #000}.sub{font-size:12px;color:#aab0ba;margin-top:4px}
.menu{width:45px;height:45px;border:1px solid #ffffff22;border-radius:50%;background:#ffffff0c;color:#fff;font-size:25px;box-shadow:0 5px 20px #0008}
.scene{position:absolute;left:50%;top:52%;width:min(92vw,500px);height:min(92vw,500px);transform:translate(-50%,-50%);perspective:1100px;touch-action:none}
.sphere{position:absolute;inset:0;transform-style:preserve-3d}
.sphere:before{content:"";position:absolute;left:50%;top:50%;width:68%;height:68%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#53617418 0,#1b243333 40%,transparent 72%);filter:blur(7px);pointer-events:none}
.icon{position:absolute;left:50%;top:50%;width:78px;height:78px;border-radius:23px;display:flex;align-items:center;justify-content:center;font-size:34px;border:1px solid #ffffff55;box-shadow:0 16px 34px #000c,0 0 18px #ffffff14,inset 0 2px 4px #fff9,inset 0 -8px 15px #0002;transform-style:preserve-3d;cursor:pointer;overflow:visible;transition:filter .12s,opacity .12s}
.icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.icon:after{content:"";position:absolute;left:10px;right:10px;top:6px;height:17px;border-radius:50%;background:linear-gradient(180deg,#fff9,#fff1 55%,transparent);filter:blur(.4px);pointer-events:none}
.name{position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;text-shadow:0 2px 9px #000,0 0 6px #000}
.blue{background:linear-gradient(145deg,#70c9ff,#2670df)}.green{background:linear-gradient(145deg,#72f391,#13934b)}.purple{background:linear-gradient(145deg,#c869ff,#5c20c8)}.red{background:linear-gradient(145deg,#ff7180,#c51b3d)}.yellow{background:linear-gradient(145deg,#fff07b,#d49c18)}.cyan{background:linear-gradient(145deg,#75fff7,#168fa5)}
.hint{position:absolute;bottom:22px;left:7%;right:7%;padding:12px;border-radius:25px;background:#ffffff0b;border:1px solid #ffffff16;text-align:center;color:#9299a5;font-size:12px;box-shadow:0 5px 20px #0005}
.overlay{display:none;position:fixed;inset:0;z-index:100;background:#000b;backdrop-filter:blur(8px);align-items:flex-end}.overlay.show{display:flex}
.panel{width:100%;max-height:92%;overflow:auto;background:#15181f;border-radius:25px 25px 0 0;padding:18px 16px 28px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:19px}.close{width:38px;height:38px;border:0;border-radius:50%;background:#ffffff0c;color:#fff;font-size:21px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{flex:1;padding:10px;border:1px solid #ffffff10;border-radius:10px;background:#ffffff06;color:#aaa}.tab.active{background:#2877df;color:#fff}
.section{background:#ffffff06;border:1px solid #ffffff0b;border-radius:14px;padding:12px;margin-bottom:9px}
input,select{width:100%;height:42px;margin-bottom:8px;padding:0 11px;border-radius:10px;background:#080a0e;border:1px solid #ffffff14;color:#fff}
button{cursor:pointer}.primary,.secondary{width:100%;min-height:42px;border:0;border-radius:10px;color:#fff;font-weight:bold}.primary{background:#2877df}.secondary{background:#ffffff0b;margin-top:6px}
.row{display:flex;align-items:center;gap:9px;padding:7px;border-radius:11px;background:#ffffff06;margin-bottom:6px}.preview{width:44px;height:44px;flex:none;border-radius:12px;background:#ffffff12;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:20px}.preview img{width:100%;height:100%;object-fit:cover}.details{flex:1;min-width:0}.details b,.details small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.details b{font-size:12px}.details small{font-size:9px;color:#777;margin-top:2px}.check{width:36px;height:36px;border:0;border-radius:9px;background:#ffffff0b;color:#fff;font-size:17px}.empty{color:#777;text-align:center;padding:15px;font-size:12px}
.toast{position:fixed;z-index:200;left:50%;bottom:80px;transform:translate(-50%,20px);opacity:0;padding:10px 14px;background:#191c23f5;border:1px solid #ffffff15;border-radius:12px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.icon{width:70px;height:70px;border-radius:21px;font-size:30px}.name{font-size:10px;bottom:-24px}.scene{width:94vw;height:94vw}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div><div class="title">Esfera de Aplicativos</div><div class="sub">Toque em um ícone para acessar</div></div><button class="menu" onclick="openManager()">⋮</button></header>
<main class="scene" id="scene"><div class="sphere" id="sphere"></div></main>
<div class="hint">Arraste a esfera com o dedo</div>
</div>
<div class="overlay" id="overlay"><div class="panel">
<div class="head"><h2>Gerenciar a Esfera</h2><button class="close" onclick="closeManager()">×</button></div>
<div class="tabs"><button id="t1" class="tab active" onclick="showTab('android')">Apps do celular</button><button id="t2" class="tab" onclick="showTab('web')">Meus Apps</button></div>
<section id="androidTab" class="section"><div id="androidList"></div><button class="secondary" onclick="loadAndroidApps()">↻ Atualizar aplicativos</button><button class="secondary" onclick="openHomeSettings()">🏠 Escolher Esfera como tela inicial</button></section>
<section id="webTab" class="section" style="display:none">
<input id="wname" placeholder="Nome do aplicativo"><input id="wurl" placeholder="URL/caminho do GitHub"><input id="wicon" placeholder="Ícone/caminho"><input id="wemoji" maxlength="4" placeholder="Emoji">
<select id="wclass"><option value="blue">Azul</option><option value="green">Verde</option><option value="purple">Roxo</option><option value="red">Vermelho</option><option value="yellow">Amarelo</option><option value="cyan">Ciano</option></select>
<button class="primary" onclick="addWebApp()">＋ Adicionar meu aplicativo</button><div id="webList" style="margin-top:10px"></div>
</section></div></div>
<div class="toast" id="toast"></div>
<script>
const WEBKEY="ESFERA_WEB_APPS_V8";
let webApps=JSON.parse(localStorage.getItem(WEBKEY)||"null")||[
{id:"gabarita",nome:"Gabarita AI",url:"gabarita.html",icon:"",emoji:"🧠",cls:"green"},
{id:"prova",nome:"PROVA AI",url:"prova.html",icon:"",emoji:"📝",cls:"purple"}
];
let androidApps=[],items=[],rx=-8,ry=0,down=false,drag=false,sx=0,sy=0,ix=0,iy=0,vx=0,vy=0;
const $=id=>document.getElementById(id),scene=$("scene"),sphere=$("sphere");
function toast(t){let e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2000)}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function native(){return typeof AndroidLauncher!=="undefined"}
function selected(){try{return JSON.parse(localStorage.getItem("ESFERA_NATIVE_SELECTED")||"[]")}catch{return[]}}
function saveSelected(a){localStorage.setItem("ESFERA_NATIVE_SELECTED",JSON.stringify(a))}
function key(a){return a.packageName+"/"+a.className}
function allApps(){let n=androidApps.filter(a=>selected().includes(key(a)));return [...n.map(a=>({type:"android",nome:a.name,icon:a.icon,emoji:"📱",cls:"blue",ref:a})),...webApps.map(a=>({type:"web",nome:a.nome,icon:a.icon,emoji:a.emoji,cls:a.cls,ref:a}))]}
function spherePoints(n){let p=[],g=Math.PI*(3-Math.sqrt(5));if(!n)return p;for(let i=0;i<n;i++){if(n===1){p.push({x:0,y:0,z:1});continue}let y=1-i/(n-1)*2,r=Math.sqrt(Math.max(0,1-y*y)),a=g*i;p.push({x:Math.cos(a)*r,y:y,z:Math.sin(a)*r})}return p}
function build(){sphere.innerHTML="";items=[];let apps=allApps(),pts=spherePoints(apps.length);apps.forEach((a,i)=>{let el=document.createElement("div");el.className="icon "+(a.cls||"blue");if(a.icon){let im=document.createElement("img");im.src=a.icon;im.alt=a.nome;el.appendChild(im)}else el.append(a.emoji||"📱");let nm=document.createElement("span");nm.className="name";nm.textContent=a.nome;el.appendChild(nm);sphere.appendChild(el);let o={el:el,p:pts[i],a:a};items.push(o);el.onclick=()=>{if(!drag)launch(a)}});render()}
function render(){let R=$("scene").clientWidth*.40,ax=rx*Math.PI/180,ay=ry*Math.PI/180;items.forEach(o=>{let p=o.p,x1=p.x,y1=p.y*Math.cos(ax)-p.z*Math.sin(ax),z1=p.y*Math.sin(ax)+p.z*Math.cos(ax),x=x1*Math.cos(ay)+z1*Math.sin(ay),z=-x1*Math.sin(ay)+z1*Math.cos(ay),d=(z+1)/2,s=.62+d*.58;o.el.style.transform=`translate3d(calc(-50% + ${x*R}px),calc(-50% + ${y1*R}px),${z*R}px) scale(${s})`;o.el.style.opacity=.38+d*.62;o.el.style.filter=`brightness(${.72+d*.48}) saturate(${.8+d*.4})`;o.el.style.zIndex=1000+Math.round(z*1000)})}
function launch(a){if(a.type==="android"&&native())AndroidLauncher.launchApp(a.ref.packageName,a.ref.className);else if(a.type==="web")location.href=a.ref.url}
scene.onpointerdown=e=>{down=true;drag=false;sx=e.clientX;sy=e.clientY;ix=rx;iy=ry;vx=0;vy=0;scene.setPointerCapture(e.pointerId)}
scene.onpointermove=e=>{if(!down)return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)drag=true;ry=iy+dx*.65;rx=ix+dy*.65;vx=dx*.018;vy=dy*.018;render()}
scene.onpointerup=()=>{down=false;setTimeout(()=>drag=false,100)}
scene.onpointercancel=()=>{down=false;setTimeout(()=>drag=false,100)}
function animation(){if(!down){rx+=vy;ry+=vx;vx*=.94;vy*=.94;if(Math.abs(vx)<.002&&Math.abs(vy)<.002)ry+=.025;render()}requestAnimationFrame(animation)}
function openManager(){$("overlay").classList.add("show");showTab("android");loadAndroidApps();renderWebList()}
function closeManager(){$("overlay").classList.remove("show")}
function showTab(t){$("androidTab").style.display=t==="android"?"block":"none";$("webTab").style.display=t==="web"?"block":"none";$("t1").classList.toggle("active",t==="android");$("t2").classList.toggle("active",t==="web")}
function loadAndroidApps(){if(!native()){$("androidList").innerHTML='<div class="empty">Esta tela precisa estar dentro do APK Launcher.</div>';return}try{androidApps=JSON.parse(AndroidLauncher.getInstalledApps()||"[]");let sel=selected();$("androidList").innerHTML=androidApps.length?androidApps.map(a=>`<div class="row"><div class="preview">${a.icon?`<img src="${a.icon}">`:"📱"}</div><div class="details"><b>${esc(a.name)}</b><small>${esc(a.packageName)}</small></div><button class="check" onclick='toggleAndroid(${JSON.stringify(a.packageName)},${JSON.stringify(a.className)})'>${sel.includes(key(a))?"✓":"＋"}</button></div>`).join(""):'<div class="empty">Nenhum aplicativo lançável encontrado.</div>'}catch(e){toast("Erro ao ler aplicativos")}}
function toggleAndroid(pkg,cls){let a=selected(),k=pkg+"/"+cls,has=a.includes(k);if(has)a=a.filter(x=>x!==k);else a.push(k);saveSelected(a);if(native())AndroidLauncher.setSelected(pkg,cls,!has);loadAndroidApps();build();toast(has?"Removido da esfera":"Adicionado à esfera")}
function renderWebList(){$("webList").innerHTML=webApps.length?webApps.map(a=>`<div class="row"><div class="preview">${a.icon?`<img src="${esc(a.icon)}">`:esc(a.emoji)}</div><div class="details"><b>${esc(a.nome)}</b><small>${esc(a.url)}</small></div><button class="check" onclick='removeWeb(${JSON.stringify(a.id)})'>🗑</button></div>`).join(""):'<div class="empty">Nenhum aplicativo web.</div>'}
function addWebApp(){let a={id:"web_"+Date.now(),nome:$("wname").value.trim(),url:$("wurl").value.trim(),icon:$("wicon").value.trim(),emoji:$("wemoji").value.trim()||"📱",cls:$("wclass").value};if(!a.nome||!a.url)return toast("Informe nome e URL/caminho.");webApps.push(a);localStorage.setItem(WEBKEY,JSON.stringify(webApps));["wname","wurl","wicon","wemoji"].forEach(x=>$(x).value="");build();renderWebList();toast("Aplicativo adicionado")}
function removeWeb(id){webApps=webApps.filter(a=>a.id!==id);localStorage.setItem(WEBKEY,JSON.stringify(webApps));build();renderWebList();toast("Aplicativo removido")}
function openHomeSettings(){if(native())AndroidLauncher.openHomeSettings();else toast("Disponível no APK Launcher")}
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeManager()});
addEventListener("resize",render);build();renderWebList();animation();
</script>
</body>
</html>
